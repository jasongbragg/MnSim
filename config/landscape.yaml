# config/landscape.yaml
#
# Landscape properties shared by all species (methodological notes T4, T7):
# defaults for single-site runs. Range-wide and Pegg runs replace them with
# each grid cell's values from the site table (runner/site_params.R).
# Each value needs a 'source' or must be a prior (prior: true, min, max, reason).

params:
  fire_prob_annual:
    value: 1/50
    prior: true
    min: 0.005
    max: 0.5
    reason: "Single-site default. Range = the floor and cap on per-cell fire rates (spatial/fire/fire_config.R; notes D2)"
  fire_p_fimp:
    value: 0.6
    prior: true
    min: 0.05
    max: 1
    reason: "Single-site default. Lower bound = PFIMP_MIN in spatial/fire/fire_config.R (notes D2, D3)"
  fire_size_sd:
    value: 0.146
    source: "docs/methodological_notes.md D3: range-wide median between-fire sd of burnt fraction (105 cells with >= 2 wildfire years, NSW + Qld, Nov 2026)"

# Spatial pipeline and site-table settings shared by all species (notes T9).
# The fire-record settings (years, fire-year threshold, floors, regimes) are in
# plant_ibm/spatial/fire/fire_config.R (notes D1-D5).
spatial:
  grid_deg:
    value: 0.1
    source: "spatial/01_get_melaleuca_occurrences.R header: 0.1 degree (~10 km), where fire and rust layers vary meaningfully"
  qld_border_lat:
    value: -28.16
    source: "Approximate NSW/Qld border on the coast; labels cells by state when a table has no fire_state, and splits states when ozmaps is unavailable (notes D4)"
  qld_bbox_margin:
    value: 0.25
    source: "Margin (degrees) added around the cells needing Qld fire data to get the Qld download area (spatial/fire/R/bbox.R; notes T10). Close to the margin of the hand-set box it replaces"
  rust_sdm:
    value: "/home/jgb/projects/mrsdm/output/projections/AP_suitability_current.tif"
    source: "mrsdm projection of A. psidii suitability (notes C2); a local file. The MN_SDM_TIFF environment variable overrides it"
